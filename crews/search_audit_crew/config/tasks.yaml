research_task:
  description: >
    PESQUISA DIRECIONADA — FERRAMENTA: {ferramenta_atual}

    Sua missão é pesquisar EXCLUSIVAMENTE a ferramenta "{ferramenta_atual}".
    Não pesquise nenhuma outra ferramenta nesta task.

    Execute as buscas nesta ordem usando a tool 'Search SerpAPI':

    FONTE 1 — Documentação Oficial:
      "{ferramenta_atual} {requisito_tecnico} official documentation"

    FONTE 2 — GitHub (código, issues, changelogs):
      "{ferramenta_atual} {requisito_tecnico} site:github.com"

    FONTE 3 — Reddit (experiências reais):
      "{ferramenta_atual} {contexto} site:reddit.com"

    FONTE 4 — Stack Overflow (problemas técnicos):
      "{ferramenta_atual} {requisito_tecnico} site:stackoverflow.com"

    Só chame 'final_answer' após completar as 4 buscas.

    REGRAS:
    - Use APENAS a tool 'Search SerpAPI'.
    - Registre links e snippets de cada fonte separadamente.
    - Apenas fatos verificáveis. Sem introduções ou conclusões.

  expected_output: >
    Texto em markdown sobre {ferramenta_atual} com subseções por tipo de fonte:

    ## {ferramenta_atual}
    ### Documentação Oficial
    - [fatos e links]
    ### GitHub
    - [fatos e links]
    ### Reddit
    - [fatos e links]
    ### Stack Overflow
    - [fatos e links]

deep_extraction_task:
  description: >
    EXTRAÇÃO PROFUNDA — FERRAMENTA: {ferramenta_atual}

    Leia os links encontrados na task anterior sobre "{ferramenta_atual}".
    Use 'Read a website content' para acessar os links mais relevantes.

    REGRA CRÍTICA:
    - Use EXCLUSIVAMENTE a tool 'Read a website content'.
    - É PROIBIDO chamar 'Search SerpAPI' nesta task.

    PRIORIDADE DE LEITURA:
    1. Documentação oficial
    2. Issues/README do GitHub
    3. Threads do Reddit ou Stack Overflow com mais votos

    PASSO A PASSO:
    1. Identifique as URLs da task anterior.
    2. Selecione os 3 links mais relevantes para: {requisito_tecnico}
    3. Acesse cada link e extraia dados técnicos.
    4. Nunca acesse o mesmo link duas vezes.
    5. Após ler os 3 links, escreva o relatório final.

    Se um link não carregar, pule para o próximo.

  expected_output: >
    Relatório técnico sobre {ferramenta_atual} com dados extraídos das páginas lidas,
    focado em: {requisito_tecnico}
    Inclua a URL de origem de cada dado extraído.

structure_task:
  description: >
    Estruture os dados coletados sobre "{ferramenta_atual}" no formato JSON exigido.

    Crie exatamente UM objeto no array "fatos" para a ferramenta "{ferramenta_atual}".

    Preencha os campos:
    - ferramenta: "{ferramenta_atual}" (nome exato)
    - arquitetura: descrição técnica baseada nos dados lidos
    - limitacoes_conhecidas: lista de limitações relevantes para: {requisito_tecnico}
    - fontes: lista de URLs utilizadas

    Se os dados forem escassos, preencha com o que foi encontrado e adicione
    "Dados insuficientes" em limitacoes_conhecidas.

    NÃO escreva introduções. Apenas o JSON.

  expected_output: >
    Um objeto JSON válido com exatamente uma entrada para {ferramenta_atual}:
    {"fatos": [{"ferramenta": "{ferramenta_atual}", "arquitetura": "descrição", "limitacoes_conhecidas": ["limite1"], "fontes": ["https://..."]}]}

audit_task:
  description: >
    ANÁLISE COMPARATIVA — CONTEXTO: {contexto}

    Você receberá dados estruturados de TODAS as ferramentas em {ferramentas_alvo}.
    Os dados estão no campo {dados_estruturados}.

    Produza uma auditoria técnica comparativa focada em: {requisito_tecnico}

    REGRA FUNDAMENTAL: Baseie toda a análise EXCLUSIVAMENTE nos dados recebidos.
    Não avalie ferramentas que não estejam nos dados. Não invente dados ausentes.

    Analise e defina:
    1. Vencedor operacional para o contexto "{contexto}" com base nos dados disponíveis
    2. Riscos SRE identificados (falhas, gargalos, limitações operacionais)
    3. Custos ocultos ou restrições relevantes para "{requisito_tecnico}"
    4. Recomendação final objetiva e direta

  expected_output: >
    Um objeto JSON válido seguindo exatamente este schema:
    {"vencedor_operacional": "Nome da ferramenta", "riscos_sre": ["risco1", "risco2"], "custos_ocultos_finops": ["custo1", "custo2"], "recomendacao_final": "texto da recomendação"}